# ==============================================================================
# Nginx Configuration: Multi-Subdomain Architecture
# Serves:
#   - Public Portal: kmlri.in (proxy to Next.js port 3000)
#   - Admin Console: admin.kmlri.in (proxy to Next.js port 3000)
#   - Backend API:   api.kmlri.in (proxy to NestJS port 4000)
# Replace 'kmlri.in' with your actual domain name.
# ==============================================================================

# Common Gzip & Security Settings
# (Usually included in http block or server blocks)

# ------------------------------------------------------------------------------
# 1. NestJS Backend API (api.kmlri.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.kmlri.in;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# ------------------------------------------------------------------------------
# 2. Librarian & Admin Portal (admin.kmlri.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.kmlri.in;

    client_max_body_size 50M;

    location /_next/static {
        proxy_pass http://127.0.0.1:3000/_next/static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 3. Main Public Website & OPAC (kmlri.in & www.kmlri.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kmlri.in www.kmlri.in;

    client_max_body_size 50M;

    location /_next/static {
        proxy_pass http://127.0.0.1:3000/_next/static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}
